<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/styles.css">
    <title>BPAC-JS Playground</title>
</head>

<body>
    <main>
        <h3 class="title">DEMO: Retail Product Tag</h3>
        <h5 class="sub-title">Template optimized for Brother QL-XX label printer models.</h5>
        <div class="image-preview">
            <img id="image-preview" src="https://placehold.co/300x300/eeeeee/555555?text=Tag+Preview+Shown+Here" alt="Tag Preview">
        </div>
        <form id="form" class="form">
            <div class="form-row">
                <label for="product-name">Product Name:</label>
                <input type="text" id="product-name">
            </div>
            <div class="form-row">
                <label for="product-weight">Weight:</label>
                <input type="text" id="product-weight">
            </div>
            <div class="form-row">
                <label for="product-price">Price:</label>
                <input type="text" id="product-price">
            </div>
            <div class="form-row">
                <label for="product-packed-date">Packed Date:</label>
                <input type="date" id="product-packed-date">
            </div>
            <div class="form-row">
                <label for="product-barcode">Barcode UPC:</label>
                <input type="text" id="product-barcode">
            </div>
            <div class="form-row">
                <label for="copies">Copies:</label>
                <input id="copies" type="number" step="1" value="1" min="1">
            </div>
            <div class="form-row">
                <label for="printers">Printer:</label>
                <select type="text" id="printers">
                    <option value="">--Choose a printer--</option>
                </select>
            </div>
            <div class="form-row btns">
                <button id="preview-btn">🔍︎ Preview</button>
                <button id="print-btn">🖨️ Print</button>
            </div>
        </form>
    </main>
    <script type="module" src="./assets/script.js"></script>
</body>

</html>
